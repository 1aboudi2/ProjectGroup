<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Suitcase body with rounded corners -->
  <rect x="50" y="80" width="300" height="180" rx="12" stroke="#2563eb" stroke-width="14" fill="none" stroke-linejoin="round"/>
  
  <!-- Handle with rounded ends -->
  <path d="M 150 80 L 150 50 L 250 50 L 250 80" stroke="#2563eb" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Wheels -->
  <circle cx="100" cy="260" r="22" fill="#2563eb"/>
  <circle cx="300" cy="260" r="22" fill="#2563eb"/>
  
  <!-- Text: ATELIER (smaller, uppercase) -->
  <text x="200" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#2563eb" text-anchor="middle" letter-spacing="3">ATELIER</text>
  
  <!-- Text: INTER CULTU RALITE (bubble style - larger, rounded) -->
  <text x="200" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle" style="font-style: normal;">INTER</text>
  <text x="200" y="195" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle">CULTU</text>
  <text x="200" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle">RALITE</text>
</svg>
